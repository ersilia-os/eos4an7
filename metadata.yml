Identifier: eos4an7
Slug: antimicrobial-activity-pfalciparum
Status: Ready
Title: Antimicrobial activity prediction against Plasmodium falciparum from 
  public ChEMBL and PubChem data
Description: Assesses antimalarial potential against Plasmodium falciparum through
  51 classifiers trained on separate ChEMBL and PubChem bioactivity pools, with single-point
  and dose-response assays modelled independently. Malaria screening has generated
  one of the largest public antiparasitic datasets, supporting a wider panel than
  most organisms allow. Individual sub-models vary considerably in the volume of data
  behind them, which the quality-weighted consensus is designed to account for.
